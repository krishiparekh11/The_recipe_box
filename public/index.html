<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Recipe Box</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Public+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <div class="wordmark">
        <span class="wordmark-the">The</span>
        <span class="wordmark-main">Recipe Box</span>
        <span class="wordmark-tag">saved from the scroll, found when you cook</span>
      </div>
      <div class="masthead-actions">
        <label class="search" for="search-input">
          <svg viewBox="0 0 24 24" aria-hidden="true" class="search-icon"><path d="M21 21l-4.3-4.3M11 19a8 8 0 1 1 0-16 8 8 0 0 1 0 16z"/></svg>
          <input id="search-input" type="search" placeholder="Search by name" autocomplete="off" />
        </label>
        <button id="add-btn" class="btn btn-primary">
          <span class="btn-plus">+</span> Add recipe
        </button>
      </div>
    </div>
  </header>

  <nav class="tabs" id="tabs" aria-label="Recipe categories"></nav>

  <main class="board" id="board">
    <!-- cards injected here -->
  </main>

  <div class="empty" id="empty" hidden>
    <div class="empty-card">
      <p class="empty-title">This drawer is empty.</p>
      <p class="empty-sub" id="empty-sub">Add your first recipe to start the box.</p>
    </div>
  </div>

  <!-- ============ Add / Edit modal ============ -->
  <div class="overlay" id="form-overlay" hidden>
    <div class="modal card-paper" role="dialog" aria-modal="true" aria-labelledby="form-title">
      <div class="card-margin"></div>
      <div class="modal-body">
        <div class="modal-head">
          <h2 id="form-title" class="modal-title">New recipe</h2>
          <button class="icon-btn" id="form-close" aria-label="Close">&times;</button>
        </div>
        <form id="recipe-form">
          <input type="hidden" id="f-id" />
          <label class="field">
            <span class="field-label">Name</span>
            <input id="f-name" type="text" required placeholder="Marry Me Chicken" />
          </label>
          <label class="field">
            <span class="field-label">Category</span>
            <select id="f-category"></select>
          </label>
          <label class="field">
            <span class="field-label">Ingredients</span>
            <textarea id="f-ingredients" rows="4" placeholder="One per line, or comma separated"></textarea>
          </label>
          <label class="field">
            <span class="field-label">Instructions</span>
            <textarea id="f-instructions" rows="5" placeholder="How to make it"></textarea>
          </label>
          <label class="field">
            <span class="field-label">Source link <span class="field-hint">(optional)</span></span>
            <input id="f-source" type="url" placeholder="https://instagram.com/..." />
          </label>
          <p class="form-error" id="form-error" hidden></p>
          <div class="modal-foot">
            <button type="button" class="btn btn-ghost" id="form-cancel">Cancel</button>
            <button type="submit" class="btn btn-primary" id="form-save">Save recipe</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- ============ Detail modal ============ -->
  <div class="overlay" id="detail-overlay" hidden>
    <div class="modal card-paper" role="dialog" aria-modal="true" aria-labelledby="detail-name">
      <div class="card-margin"></div>
      <div class="modal-body" id="detail-body">
        <!-- filled by JS -->
      </div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="/js/app.js"></script>
</body>
</html>
