<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Recipe Box</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <!-- ============ Top bar ============ -->
  
    <!-- ============ Inline add / edit form (NOT a modal) ============ -->
    <section id="form-panel" class="form-panel" hidden aria-label="Recipe editor">
      <div class="form-head">
        <h2 id="form-title" class="form-title">New recipe</h2>
        <button id="form-close" class="link-btn" type="button">Close</button>
      </div>

      <form id="recipe-form" autocomplete="off">
        <input type="hidden" id="f-id" />

        <div class="grid-2">
          <label class="field field-name">
            <span class="field-label">Name</span>
            <input
              id="f-name" type="text" required placeholder="e.g. Marry Me Chicken"
              autocomplete="off" data-1p-ignore="true" data-lpignore="true" data-form-type="other"
            />
          </label>

          <label class="field">
            <span class="field-label">Category</span>
            <select id="f-category" autocomplete="off"></select>
          </label>
        </div>

        <label class="field">
          <span class="field-label">Ingredients</span>
          <textarea
            id="f-ingredients" rows="4" placeholder="One per line, or comma separated"
            autocomplete="off" data-1p-ignore="true" data-lpignore="true" data-gramm="false"
          ></textarea>
        </label>

        <label class="field">
          <span class="field-label">Instructions</span>
          <textarea
            id="f-instructions" rows="5" placeholder="How to make it"
            autocomplete="off" data-1p-ignore="true" data-lpignore="true" data-gramm="false"
          ></textarea>
        </label>

        <label class="field">
          <span class="field-label">Source link <span class="field-hint">optional</span></span>
          <input
            id="f-source" type="url" placeholder="https://instagram.com/..."
            autocomplete="off" data-1p-ignore="true" data-lpignore="true" data-form-type="other"
          />
        </label>

        <p class="form-error" id="form-error" hidden></p>

        <div class="form-foot">
          <button type="button" class="btn btn-ghost" id="form-cancel">Cancel</button>
          <button type="submit" class="btn btn-primary" id="form-save">Save recipe</button>
        </div>
      </form>
    </section>

    <!-- ============ Filters ============ -->
    <nav class="filters" id="filters" aria-label="Filter recipes"></nav>

    <!-- ============ Recipe grid ============ -->
    <section class="board" id="board" aria-live="polite"><!-- cards injected --></section>

    <!-- ============ Empty state ============ -->
    <div class="empty" id="empty" hidden>
      <p class="empty-title" id="empty-title">This box is empty.</p>
      <p class="empty-sub" id="empty-sub">Add your first recipe to get started.</p>
    </div>
  </main>

  <!-- Toast never blocks clicks (pointer-events: none in CSS) -->
  <div class="toast" id="toast" role="status" hidden></div>

  <script src="/js/app.js"></script>
</body>
</html>
